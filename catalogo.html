<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <title>Nexo Tech | Catálogo</title>
</head>
<body class="d-flex flex-column min-vh-100" data-page="catalogo">

  <!-- Navegación -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html"><span class="brand-mark">N</span> Nexo Tech</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" data-page="inicio" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link active" data-page="catalogo" href="catalogo.html">Catálogo</a></li>
          <li class="nav-item"><a class="nav-link" data-page="producto" href="producto.html">Producto</a></li>
          <li class="nav-item"><a class="nav-link" data-page="carrito" href="carrito.html">Carrito</a></li>
          <li class="nav-item"><a class="nav-link" data-page="perfil" href="perfil.html">Mi perfil</a></li>
          <li class="nav-item"><a class="nav-link" data-page="admin" href="admin.html">Administración</a></li>
        </ul>
        <button class="btn btn-outline-light btn-sm" id="btnLoginPlaceholder">Ingresar</button>
      </div>
    </div>
  </nav>

  <!-- Contenido Principal Dinámico -->
  <main class="flex-grow-1">
    <div class="container py-5">
      <h1 class="mb-4 fw-bold">Catálogo de Productos</h1>

      <!-- Controles de Búsqueda y Filtros (Semana 2) -->
      <div class="row mb-4 g-2">
        <div class="col-md-6">
          <input type="text" id="input-buscador" class="form-control" placeholder="Buscar producto por nombre...">
        </div>
        <div class="col-md-4">
          <select id="select-categoria" class="form-select">
            <option value="todas">Todas las categorías</option>
            <option value="Robótica">Robótica</option>
            <option value="Sensores">Sensores</option>
            <option value="Periféricos">Periféricos</option>
          </select>
        </div>
        <div class="col-md-2">
          <button id="btn-limpiar" class="btn btn-outline-secondary w-100">Limpiar</button>
        </div>
      </div>

      <!-- Contenedor Dinámico para Tarjetas (Semana 1) -->
      <div class="row" id="contenedor-productos">
        <!-- Las tarjetas se generan dinámicamente desde js/catalogo.js -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer py-4 mt-auto">
    <div class="container d-flex justify-content-between flex-wrap gap-2">
      <span>© 2026 Nexo Tech · Proyecto integrador</span>
      <span>Sprint 2 · Catálogo Dinámico</span>
    </div>
  </footer>

  <!-- Toast de Notificación -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast">
      <div class="toast-header">
        <strong class="me-auto">Nexo Store</strong>
        <button class="btn-close" data-bs-dismiss="toast"></button>
      </div>
      <div class="toast-body" id="toastMessage"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/base.js"></script>
  <!-- Scripts para Catálogo Dinámico del Sprint 2 -->
  <script src="js/productos.js"></script>
  <script src="js/catalogo.js"></script>
</body>
</html>
